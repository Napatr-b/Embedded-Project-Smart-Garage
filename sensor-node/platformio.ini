; Sensor Node: ESP32 DOIT DevKit V1, Arduino
[env:esp32doit]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = -I ../shared/protocol
lib_deps =
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor
  ; TODO: ENS160 library (pick one and pin its version)
