[platformio]
default_envs = gateway_bringup

[env]
platform = platformio/espressif32@6.12.0
platform_packages =
    platformio/framework-espidf@3.50500.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:gateway_bringup]
build_flags = ${env.build_flags} -DGARAGE_NETWORK_ENABLED=0 -DGARAGE_SIMULATED_HARDWARE=0

[env:gateway_mqtt]
build_flags = ${env.build_flags} -DGARAGE_NETWORK_ENABLED=1 -DGARAGE_SIMULATED_HARDWARE=0

[env:gateway_simulated]
build_flags = ${env.build_flags} -DGARAGE_NETWORK_ENABLED=1 -DGARAGE_SIMULATED_HARDWARE=1

; N16R8 module verified by flash_id + module label; carrier board identity still separate.
[env:gateway_local_n16r8]
board = yd-esp32-s3-n16r8
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.n16r8.defaults"
build_flags = ${env.build_flags} -DGARAGE_NETWORK_ENABLED=1 -DGARAGE_SIMULATED_HARDWARE=1 -DGARAGE_LOCAL_TEST=1 -DGARAGE_EXPECTED_FLASH_BYTES=16777216
