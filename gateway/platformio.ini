; Gateway: ESP32-S3 N16R8 module (16 MB flash, 8 MB octal PSRAM), ESP-IDF.
; Every env targets the same board; they differ only in what is enabled.
[platformio]
default_envs = gateway_bringup

[env]
platform = platformio/espressif32@6.12.0
platform_packages =
    platformio/framework-espidf@3.50500.0
board = yd-esp32-s3-n16r8
framework = espidf
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = -Wall -Wextra -DGARAGE_EXPECTED_FLASH_BYTES=16777216

; Real sensor data from the node over ESP-NOW (default) or UART (-DGARAGE_LINK_ESPNOW=0), no MQTT.
; Start here for node link bring-up.
[env:gateway_bringup]
build_flags = ${env.build_flags} -DGARAGE_NETWORK_ENABLED=0 -DGARAGE_SIMULATED_HARDWARE=0

; UART self-test: jumper GPIO17 -> GPIO18 on the gateway, node unplugged. Prints PASS/FAIL every 2 s.
[env:gateway_uart_loopback]
build_flags = ${env.build_flags} -DGARAGE_NETWORK_ENABLED=0 -DGARAGE_SIMULATED_HARDWARE=0 -DGARAGE_UART_LOOPBACK_TEST=1 -DGARAGE_LINK_ESPNOW=0

; Wiring finder: no jumper needed, keep the node running. Shows which gateway GPIO the node's TX wire is on.
[env:gateway_pin_finder]
build_flags = ${env.build_flags} -DGARAGE_NETWORK_ENABLED=0 -DGARAGE_SIMULATED_HARDWARE=0 -DGARAGE_UART_PIN_FINDER=1 -DGARAGE_LINK_ESPNOW=0

; Real node data published over MQTT (TLS). Needs include/config.local.h.
[env:gateway_mqtt]
build_flags = ${env.build_flags} -DGARAGE_NETWORK_ENABLED=1 -DGARAGE_SIMULATED_HARDWARE=0

; Simulated sensors + simulated door over MQTT (TLS), for dashboard work without hardware.
[env:gateway_simulated]
build_flags = ${env.build_flags} -DGARAGE_NETWORK_ENABLED=1 -DGARAGE_SIMULATED_HARDWARE=1

; Simulated hardware over plain mqtt:// to the local test broker (tools/local-broker). LAN testing only.
[env:gateway_local_n16r8]
build_flags = ${env.build_flags} -DGARAGE_NETWORK_ENABLED=1 -DGARAGE_SIMULATED_HARDWARE=1 -DGARAGE_LOCAL_TEST=1
